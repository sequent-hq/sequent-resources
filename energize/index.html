  function notice(text){$('status').textContent=text;$('portal-notice').textContent=text;setTimeout(()=>{if($('portal-notice').textContent===text)$('portal-notice').textContent=''},8000)}

  function validCatalog(value){return value?.version===1&&value.default_route==='main'&&Array.isArray(value.entries)&&value.entries.some(entry=>entry.id==='main')&&value.entries.every(entry=>/^[a-z0-9][a-z0-9_-]*$/i.test(entry.id)&&/^assets\/[a-f0-9]{32}\.bin$/.test(entry.packet)&&/^[a-f0-9]{32}$/.test(entry.packet_id)&&['html','markdown','text','dataset','download'].includes(entry.kind))}
  async function unzip(bytes){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
  function findEntry(id){return catalog?.entries.find(entry=>entry.id===id)}
  function resolvePath(raw,fromId=currentId){
    if(typeof raw!=='string'||/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith('//')||raw.includes('\\')||raw.includes('\u0000'))return null;

  }
  async function packet(entry){
    if(packetCache.has(entry.packet))return packetCache.get(entry.packet);
    const capturedEpoch=epoch,capturedKey=key;if(!capturedKey)throw Error('Workspace is locked.');
    const promise=(async()=>{const response=await fetch(entry.packet,{cache:'no-store',credentials:'omit',signal:aborter.signal});if(!response.ok)throw Error('The encrypted file could not be loaded.');const encrypted=new Uint8Array(await response.arrayBuffer());if(encrypted.length<29)throw Error('Invalid encrypted packet.');const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(0,12),additionalData:encode.encode('energize-private-portal:1:packet:'+entry.packet_id),tagLength:128},capturedKey,encrypted.slice(12));const decompressed=await unzip(bytes);new Uint8Array(bytes).fill(0);if(capturedEpoch!==epoch||capturedKey!==key){decompressed.fill(0);throw Error('Workspace is locked.')}return JSON.parse(decode.decode(decompressed))})();

  }
  async function payload(entry){const capturedEpoch=epoch,capturedKey=key;const container=await packet(entry);if(capturedEpoch!==epoch||capturedKey!==key||!key)throw Error('Workspace is locked.');const value=container.files[entry.payload_key];if(!value)throw Error('This file was not found in the encrypted packet.');return value}
  function bytesOf(value){return value.encoding==='base64'?from64(value.content):encode.encode(value.content)}
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function preview(entry,value){const text=value.encoding==='base64'?'This native file is available as an encrypted download.':value.content;const partial=text.length>1200000;const body=partial?text.slice(0,1200000):text;return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(entry.title)+'</title><style>body{background:#11170f;color:#e5ecdc;font:14px/1.6 system-ui;margin:0}main{padding:30px;max-width:1200px;margin:auto}h1{font-size:28px}p{color:#b9c6a9}a{color:#e2ba60}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;border:1px solid #4b593f;background:#1b2517;padding:18px;border-radius:10px}</style></head><body><main><p>Energize · '+esc(entry.group)+'</p><h1>'+esc(entry.title)+'</h1><p>'+esc(entry.status||'Captured source; source-specific coverage limits apply.')+'</p><p><a href="#download" data-energize-download="'+esc(entry.id)+'">Download complete file ↓</a></p>'+(partial?'<p>Preview shows the first 1.2 million characters. The download contains the complete sanitized file.</p>':'')+'<pre>'+esc(body)+'</pre></main><script>'+"\n'use strict';\n(() => {\n  const pending=new Map();let sequence=0;\n  if(document.documentElement.dataset.portalKind==='hash-document')globalThis.energizeViewHash='';\n  const request=(operation,path,signal)=>new Promise((resolve,reject)=>{\n    if(signal?.aborted){reject(new DOMException('The request was cancelled.','AbortError'));return}\n    const requestId=Date.now().toString(36)+'-'+(++sequence)+'-'+Math.random().toString(36).slice(2);\n    const cleanup=()=>signal?.removeEventListener('abort',abort);\n    const timer=setTimeout(()=>{pending.delete(requestId);cleanup();reject(Error('The file is not available in this shared portal.'))},120000);\n    const abort=()=>{clearTimeout(timer);pending.delete(requestId);cleanup();reject(new DOMException('The request was cancelled.','AbortError'))};\n    signal?.addEventListener('abort',abort,{once:true});pending.set(requestId,{resolve,reject,timer,cleanup});window.parent.postMessage({type:'energize-request',operation,path,requestId},'*');\n  });\n  window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='energize-response')return;const item=pending.get(event.data.requestId);if(!item)return;clearTimeout(item.timer);item.cleanup();pending.delete(event.data.requestId);if(event.data.error)item.reject(Error(event.data.error));else item.resolve(event.data)});\n  globalThis.fetch=async(input,options)=>{if(options?.method&&!['GET','HEAD'].includes(options.method.toUpperCase()))throw Error('The shared archive is read only.');const path=typeof input==='string'?input:input?.url;const response=await request('read',path,options?.signal);return new Response(response.bytes,{status:200,headers:{'Content-Type':response.mime||'application/octet-stream'}})};\n  document.addEventListener('click',event=>{\n    const print=event.target.closest('[data-energize-print]');if(print&&!event.defaultPrevented){event.preventDefault();window.print();return}\n    const link=event.target.closest('a');if(!link||event.defaultPrevented)return;\n    if(link.dataset.energizeRoute){event.preventDefault();window.parent.postMessage({type:'energize-route',route:link.dataset.energizeRoute},'*');return}\n    if(link.dataset.energizeDownload){event.preventDefault();window.parent.postMessage({type:'energize-download',id:link.dataset.energizeDownload},'*');return}\n    const href=link.getAttribute('href');if(!href)return;\n    if(href.startsWith('#')){if(document.documentElement.dataset.portalKind==='hash-document'){event.preventDefault();globalThis.energizeViewHash=href;window.dispatchEvent(new Event('hashchange'));return}if(['main','register'].includes(document.documentElement.dataset.portalKind))return;event.preventDefault();document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();return}\n    if(/^https?:/i.test(href)){link.target='_blank';link.rel='noopener noreferrer';return}\n    if(/^(?:mailto:|tel:|data:|blob:)/i.test(href))return;\n    event.preventDefault();request(link.hasAttribute('download')?'download':'open',href).catch(error=>window.parent.postMessage({type:'energize-notice',message:error.message},'*'));\n  },true);\n})();\n"+'<\/script></body></html>'}
  async function show(id,requestPath=''){
    const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch,ticket=++routeEpoch,wasCached=documentCache.has(id);notice('Opening '+entry.title+'…');
    let html=documentCache.get(id);if(!html){const value=await payload(entry);if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;html=value.render_html||(entry.kind==='html'?value.content:preview(entry,value));documentCache.set(id,html)}
    if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;currentId=id;let shown=id==='main'&&wasCached?html.replace('<html','<html data-energize-boot-seen="true"'):html;const sourcePath=requestPath||entry.relative_path||'';if(sourcePath)shown=shown.replace('<html','<html data-energize-request-path="'+esc(sourcePath.slice(0,8192))+'"');$('workspace').srcdoc=shown;$('route').value=id;notice('');
  }
  async function download(id){const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch;const value=await payload(entry);if(capturedEpoch!==epoch||!key)return;const url=URL.createObjectURL(new Blob([bytesOf(value)],{type:entry.mime||'application/octet-stream'}));blobUrls.add(url);const anchor=document.createElement('a');anchor.href=url;anchor.download=entry.output_name||entry.title;anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);blobUrls.delete(url)},600000);notice('Download started for '+(entry.output_name||entry.title));}
  function fillRoutes(){const select=$('route');select.replaceChildren();for(const entry of catalog.entries.filter(item=>item.id==='main'||item.id==='register'||item.pinned)){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.title;select.append(option)}}
  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>show($('route').value).catch(error=>notice(error.message)));window.addEventListener('pagehide',lock);
  window.addEventListener('message',async event=>{
    if(event.source!==$('workspace').contentWindow||!key||!catalog)return;const data=event.data||{},capturedEpoch=epoch;
    try{
      if(data.type==='energize-route'){await show(data.route);return}
      if(data.type==='energize-download'){await download(data.id);return}
      if(data.type==='energize-notice'){notice(String(data.message||''));return}
      if(data.type!=='energize-request'||typeof data.requestId!=='string')return;

      if(capturedEpoch===epoch&&key)event.source.postMessage({type:'energize-response',requestId:data.requestId},'*');
    }catch(error){if(capturedEpoch===epoch&&key){notice(error.message);if(data.type==='energize-request')event.source.postMessage({type:'energize-response',requestId:data.requestId,error:error.message},'*')}}
  });
  $('unlock-form').addEventListener('submit',async event=>{
    event.preventDefault();if(pending)return;pending=true;const capturedEpoch=epoch;let password=$('password').value,secretBytes=null,material=null,derived=null,plain=null;
    $('password').value='';$('unlock').disabled=true;$('status').textContent='Unlocking…';
    try{
      if(!crypto?.subtle||typeof DecompressionStream==='undefined')throw Error('Use a current browser over HTTPS.');
      if(envelope.version!==1||envelope.algorithm!=='AES-256-GCM'||envelope.kdf!=='PBKDF2-SHA256'||envelope.iterations!==600000||envelope.compression!=='gzip')throw Error('Invalid catalog.');

      $('workspace').hidden=false;$('lock-bar').hidden=false;$('unlock-card').hidden=true;document.body.classList.add('open');$('status').textContent='';
    }catch{key=null;catalog=null;packetCache.clear();documentCache.clear();aborter?.abort();aborter=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;if(capturedEpoch===epoch&&!document.hidden){$('status').textContent='Unable to unlock. Check the password or retry the link.';$('password').focus()}}
    finally{password=null;material=null;derived=null;if(secretBytes)secretBytes.fill(0);if(plain)new Uint8Array(plain).fill(0);pending=false;$('unlock').disabled=false}
  });
})();
