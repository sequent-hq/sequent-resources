  function preview(entry,value){const text=value.encoding==='base64'?'This native file is available as an encrypted download.':value.content;const partial=text.length>1200000;const body=partial?text.slice(0,1200000):text;return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(entry.title)+'</title><style>body{background:#11170f;color:#e5ecdc;font:14px/1.6 system-ui;margin:0}main{padding:30px;max-width:1200px;margin:auto}h1{font-size:28px}p{color:#b9c6a9}a{color:#e2ba60}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;border:1px solid #4b593f;background:#1b2517;padding:18px;border-radius:10px}</style></head><body><main><p>Energize · '+esc(entry.group)+'</p><h1>'+esc(entry.title)+'</h1><p>'+esc(entry.status||'Captured source; source-specific coverage limits apply.')+'</p><p><a href="#download" data-energize-download="'+esc(entry.id)+'">Download complete file ↓</a></p>'+(partial?'<p>Preview shows the first 1.2 million characters. The download contains the complete sanitized file.</p>':'')+'<pre>'+esc(body)+'</pre></main><script>'+"\n'use strict';\n(() => {\n  const pending=new Map();let sequence=0;\n  const request=(operation,path)=>new Promise((resolve,reject)=>{\n    const requestId=Date.now().toString(36)+'-'+(++sequence)+'-'+Math.random().toString(36).slice(2);\n    const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('The file is not available in this shared portal.'))},120000);\n    pending.set(requestId,{resolve,reject,timer});window.parent.postMessage({type:'energize-request',operation,path,requestId},'*');\n  });\n  window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='energize-response')return;const item=pending.get(event.data.requestId);if(!item)return;clearTimeout(item.timer);pending.delete(event.data.requestId);if(event.data.error)item.reject(Error(event.data.error));else item.resolve(event.data)});\n  globalThis.fetch=async(input,options)=>{if(options?.method&&!['GET','HEAD'].includes(options.method.toUpperCase()))throw Error('The shared archive is read only.');const path=typeof input==='string'?input:input?.url;const response=await request('read',path);return new Response(response.bytes,{status:200,headers:{'Content-Type':response.mime||'application/octet-stream'}})};\n  document.addEventListener('click',event=>{\n    const print=event.target.closest('[data-energize-print]');if(print&&!event.defaultPrevented){event.preventDefault();window.print();return}\n    const link=event.target.closest('a');if(!link||event.defaultPrevented)return;\n    if(link.dataset.energizeRoute){event.preventDefault();window.parent.postMessage({type:'energize-route',route:link.dataset.energizeRoute},'*');return}\n    if(link.dataset.energizeDownload){event.preventDefault();window.parent.postMessage({type:'energize-download',id:link.dataset.energizeDownload},'*');return}\n    const href=link.getAttribute('href');if(!href)return;\n    if(href.startsWith('#')){if(['main','register'].includes(document.documentElement.dataset.portalKind))return;event.preventDefault();document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();return}\n    if(/^https?:/i.test(href)){link.target='_blank';link.rel='noopener noreferrer';return}\n    if(/^(?:mailto:|tel:|data:|blob:)/i.test(href))return;\n    event.preventDefault();request(link.hasAttribute('download')?'download':'open',href).catch(error=>window.parent.postMessage({type:'energize-notice',message:error.message},'*'));\n  },true);\n})();\n"+'<\/script></body></html>'}
  async function show(id){
    const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch,ticket=++routeEpoch;notice('Opening '+entry.title+'…');
    let html=documentCache.get(id);if(!html){const value=await payload(entry);if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;html=value.render_html||(entry.kind==='html'?value.content:preview(entry,value));documentCache.set(id,html)}
    if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;currentId=id;$('workspace').srcdoc=html;$('route').value=id;notice('');
  }
  async function download(id){const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch;const value=await payload(entry);if(capturedEpoch!==epoch||!key)return;const url=URL.createObjectURL(new Blob([bytesOf(value)],{type:entry.mime||'application/octet-stream'}));blobUrls.add(url);const anchor=document.createElement('a');anchor.href=url;anchor.download=entry.output_name||entry.title;anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);blobUrls.delete(url)},30000);notice('Downloaded '+(entry.output_name||entry.title));}
  function fillRoutes(){const select=$('route');select.replaceChildren();for(const entry of catalog.entries.filter(item=>item.id==='main'||item.id==='register'||item.pinned)){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.title;select.append(option)}}
  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>show($('route').value).catch(error=>notice(error.message)));window.addEventListener('pagehide',lock);
  window.addEventListener('message',async event=>{
    if(event.source!==$('workspace').contentWindow||!key||!catalog)return;const data=event.data||{},capturedEpoch=epoch;
    try{
      if(data.type==='energize-route'){await show(data.route);return}
      if(data.type==='energize-download'){await download(data.id);return}
      if(data.type==='energize-notice'){notice(String(data.message||''));return}
      if(data.type!=='energize-request'||typeof data.requestId!=='string')return;
      const id=resolvePath(data.path);if(!id)throw Error('This file is not included in the hosted portal; check the source inventory.');const entry=findEntry(id);
      if(data.operation==='read'){const value=await payload(entry),bytes=bytesOf(value);if(capturedEpoch!==epoch||!key)return;event.source.postMessage({type:'energize-response',requestId:data.requestId,bytes:bytes.buffer,mime:entry.mime},'*',[bytes.buffer]);return}
      if(data.operation==='download')await download(id);else if(data.operation==='open')await show(id);else throw Error('Unsupported request.');
      if(capturedEpoch===epoch&&key)event.source.postMessage({type:'energize-response',requestId:data.requestId},'*');
    }catch(error){if(capturedEpoch===epoch&&key){notice(error.message);if(data.type==='energize-request')event.source.postMessage({type:'energize-response',requestId:data.requestId,error:error.message},'*')}}
  });
  $('unlock-form').addEventListener('submit',async event=>{
    event.preventDefault();if(pending)return;pending=true;const capturedEpoch=epoch;let password=$('password').value,secretBytes=null,material=null,derived=null,plain=null;
    $('password').value='';$('unlock').disabled=true;$('status').textContent='Unlocking…';
    try{
      if(!crypto?.subtle||typeof DecompressionStream==='undefined')throw Error('Use a current browser over HTTPS.');
      if(envelope.version!==1||envelope.algorithm!=='AES-256-GCM'||envelope.kdf!=='PBKDF2-SHA256'||envelope.iterations!==600000||envelope.compression!=='gzip')throw Error('Invalid catalog.');
      const salt=from64(envelope.salt),iv=from64(envelope.iv);if(salt.length!==32||iv.length!==12)throw Error('Invalid catalog.');
      secretBytes=encode.encode(password);password=null;material=await crypto.subtle.importKey('raw',secretBytes,'PBKDF2',false,['deriveKey']);secretBytes.fill(0);secretBytes=null;
      derived=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);material=null;
      plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:encode.encode('energize-private-portal:1:catalog'),tagLength:128},derived,from64(envelope.ciphertext));
      const unpacked=await unzip(plain);new Uint8Array(plain).fill(0);plain=null;const nextCatalog=JSON.parse(decode.decode(unpacked));unpacked.fill(0);
      if(capturedEpoch!==epoch||document.hidden){derived=null;return}if(!validCatalog(nextCatalog))throw Error('Invalid catalog.');
      key=derived;derived=null;catalog=nextCatalog;aborter=new AbortController();fillRoutes();await show('main');if(capturedEpoch!==epoch||!key)return;
      $('workspace').hidden=false;$('lock-bar').hidden=false;$('unlock-card').hidden=true;document.body.classList.add('open');$('status').textContent='';
    }catch{key=null;catalog=null;packetCache.clear();documentCache.clear();aborter?.abort();aborter=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;if(capturedEpoch===epoch&&!document.hidden){$('status').textContent='Unable to unlock. Check the password or retry the link.';$('password').focus()}}
    finally{password=null;material=null;derived=null;if(secretBytes)secretBytes.fill(0);if(plain)new Uint8Array(plain).fill(0);pending=false;$('unlock').disabled=false}
  });
})();
