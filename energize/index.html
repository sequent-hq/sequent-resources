:root{color-scheme:dark;--gold:#d9b054;--text:#edf0e5;--muted:#a7ae99}*{box-sizing:border-box}body{margin:0;background:#11150f;color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px;overflow-x:hidden}body::before{content:"";position:fixed;inset:-40%;z-index:-1;background:radial-gradient(ellipse at 30% 30%,#3e371b80,transparent 40%),radial-gradient(ellipse at 70% 60%,#33432180,transparent 45%);animation:drift 12s ease-in-out infinite alternate}.energy{position:fixed;width:52vw;max-width:720px;right:-15vw;top:5vh;height:90vh;z-index:-1;fill:none;stroke:#d9b0542b;stroke-width:1.6;filter:drop-shadow(0 0 14px #b9994088);animation:pulse 5s ease-in-out infinite}.card{width:min(480px,100%);position:relative;background:#1a1f16e8;border:1px solid #56613b70;border-radius:23px;padding:38px;box-shadow:0 40px 130px #0008;backdrop-filter:blur(12px)}.logo{width:200px;height:auto;display:block;margin-bottom:34px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}h1{font-size:36px;letter-spacing:-.04em;line-height:1.08;margin:0 0 14px}p{color:var(--muted);font-size:14px;margin:0 0 27px}label{display:block;color:#dfe6d1;font-size:12px;font-weight:600;margin-bottom:8px}input{display:block;width:100%;border:1px solid #4a533a;background:#11160e;border-radius:11px;padding:13px 15px;font:16px inherit;color:var(--text);outline:none;margin-bottom:14px}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d9b05418}button{border:0;border-radius:11px;cursor:pointer;font:600 14px inherit;background:var(--gold);color:#19190e;padding:13px 18px;width:100%}button:hover{background:#edc56a}button:disabled{opacity:.65;cursor:wait}#status{min-height:1.7em;color:#eac577;font-size:12px;margin-top:12px}small{display:block;color:#859078;font-size:11px;margin-top:14px}#lock-bar{position:fixed;top:0;left:0;right:0;height:44px;z-index:4;display:flex;align-items:center;justify-content:space-between;background:#11150f;border-bottom:1px solid #3b442e;padding:0 18px;font-size:11px;letter-spacing:.04em;color:#bdc8ad}#lock{width:auto;padding:5px 16px;font-size:11px}#workspace{border:0;width:100vw;height:calc(100dvh - 44px);position:fixed;top:44px;left:0;background:#11150f}body.open{padding:0}body.open::before,body.open>.energy{display:none}[hidden]{display:none!important}@keyframes drift{to{transform:rotate(12deg) translateX(3%)}}@keyframes pulse{50%{opacity:.35;transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:520px){.card{padding:28px}h1{font-size:30px}.logo{width:176px}}
select{color:#edf0e5;background:#242b1e;border:1px solid #596245;border-radius:6px;padding:4px 8px;font:12px inherit}.route-label{display:flex;align-items:center;gap:8px;margin:0;font-size:11px}@media(max-width:530px){#lock-bar>span{font-size:9px}.route-label{font-size:0}.route-label select{font-size:11px}}#portal-notice{position:fixed;z-index:8;bottom:16px;right:16px;max-width:520px;background:#1c2816;color:#dfebd3;border:1px solid #536747;border-radius:9px;padding:8px 14px;font-size:12px}#portal-notice:empty{display:none}
/* Energize tools: a wrapper-only launcher, visible after successful unlock. */
#energize-tools{display:flex;align-items:center;gap:6px;margin:0 12px;white-space:nowrap}
.energize-tools-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:3px}
#energize-tools a{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border:1px solid #d9b05466;border-radius:6px;background:#d9b0540d;color:#e8c675;font-size:11px;font-weight:600;line-height:1.2;text-decoration:none;letter-spacing:0}
#energize-tools a:hover{background:#d9b05424;border-color:var(--gold);color:#fff0c9}
#energize-tools a:focus-visible{outline:2px solid #edc56a;outline-offset:3px}
@media(max-width:1100px){#lock-bar{height:78px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:34px 34px;gap:0 10px;padding:4px 12px}#lock-bar>span{grid-column:1;grid-row:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lock-bar>.route-label{grid-column:2;grid-row:1}#lock-bar>#lock{grid-column:3;grid-row:1}#energize-tools{grid-column:1/-1;grid-row:2;margin:0;justify-content:flex-start}#workspace{top:78px;height:calc(100dvh - 78px)}}

istener('abort',abort,{once:true});pending.set(requestId,{resolve,reject,timer,cleanup});window.parent.postMessage({type:'energize-request',operation,path,requestId},'*');\n  });\n  window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='energize-response')return;const item=pending.get(event.data.requestId);if(!item)return;clearTimeout(item.timer);item.cleanup();pending.delete(event.data.requestId);if(event.data.error)item.reject(Error(event.data.error));else item.resolve(event.data)});\n  globalThis.fetch=async(input,options)=>{if(options?.method&&!['GET','HEAD'].includes(options.method.toUpperCase()))throw Error('The shared archive is read only.');const path=typeof input==='string'?input:input?.url;const response=await request('read',path,options?.signal);return new Response(response.bytes,{status:200,headers:{'Content-Type':response.mime||'application/octet-stream'}})};\n  document.addEventListener('click',event=>{\n    const print=event.target.closest('[data-energize-print]');if(print&&!event.defaultPrevented){event.preventDefault();window.print();return}\n    const link=event.target.closest('a');if(!link||event.defaultPrevented)return;\n    if(link.dataset.energizeRoute){event.preventDefault();window.parent.postMessage({type:'energize-route',route:link.dataset.energizeRoute},'*');return}\n    if(link.dataset.energizeDownload){event.preventDefault();window.parent.postMessage({type:'energize-download',id:link.dataset.energizeDownload},'*');return}\n    const href=link.getAttribute('href');if(!href)return;\n    if(href.startsWith('#')){if(document.documentElement.dataset.portalKind==='hash-document'){event.preventDefault();globalThis.energizeViewHash=href;window.dispatchEvent(new Event('hashchange'));return}if(['main','register'].includes(document.documentElement.dataset.portalKind))return;event.preventDefault();document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();return}\n    if(/^https?:/i.test(href)){link.target='_blank';link.rel='noopener noreferrer';return}\n    if(/^(?:mailto:|tel:|data:|blob:)/i.test(href))return;\n    event.preventDefault();request(link.hasAttribute('download')?'download':'open',href).catch(error=>window.parent.postMessage({type:'energize-notice',message:error.message},'*'));\n  },true);\n})();\n"+'<\/script></body></html>'}
  async function show(id,requestPath=''){
    const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch,ticket=++routeEpoch,wasCached=documentCache.has(id);notice('Opening '+entry.title+'…');
    let html=documentCache.get(id);if(!html){const value=await payload(entry);if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;html=value.render_html||(entry.kind==='html'?value.content:preview(entry,value));documentCache.set(id,html)}
    if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;currentId=id;let shown=id==='main'&&wasCached?html.replace('<html','<html data-energize-boot-seen="true"'):html;const sourcePath=requestPath||entry.relative_path||'';if(sourcePath)shown=shown.replace('<html','<html data-energize-request-path="'+esc(sourcePath.slice(0,8192))+'"');$('workspace').srcdoc=shown;$('route').value=id;notice('');
  }
  async function download(id){const entry=findEntry(id);if(!entry||!key)return;const capturedEpoch=epoch;const value=await payload(entry);if(capturedEpoch!==epoch||!key)return;const url=URL.createObjectURL(new Blob([bytesOf(value)],{type:entry.mime||'application/octet-stream'}));blobUrls.add(url);const anchor=document.createElement('a');anchor.href=url;anchor.download=entry.output_name||entry.title;anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);blobUrls.delete(url)},600000);notice('Download started for '+(entry.output_name||entry.title));}
  const operationRoutes=Object.freeze({
    'operations-community':Object.freeze({title:'Community management',url:'https://energize-operations.etheox.chatgpt.site/operations#community'}),
    'operations-optimizer':Object.freeze({title:'Campaign optimizer',url:'https://energize-operations.etheox.chatgpt.site/operations#optimizer'}),
    'operations-scanner':Object.freeze({title:'Product video scanner',url:'https://energize-operations.etheox.chatgpt.site/operations#scanner'})
  });
  function fillRoutes(){const select=$('route');select.replaceChildren();for(const entry of catalog.entries.filter(item=>item.id==='main'||item.id==='register'||item.pinned)){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.title;select.append(option)}const group=document.createElement('optgroup');group.label='Energize tools';for(const [id,operation]of Object.entries(operationRoutes)){const option=document.createElement('option');option.value=id;option.textContent=operation.title+' ↗';group.append(option)}select.append(group)}
  function openOperation(id){const operation=Object.hasOwn(operationRoutes,id)?operationRoutes[id]:null;if(!operation)return false;$('route').value=currentId||'main';if(!key||!catalog||$('lock-bar').hidden)return true;try{window.open(operation.url,'_blank','noopener,noreferrer');notice('Opening '+operation.title+' in a separate tab.')}catch{notice('Allow a new tab to open '+operation.title+'.')}return true;}
  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>{const id=$('route').value;if(openOperation(id))return;show(id).catch(error=>notice(error.message))});window.addEventListener('pagehide',lock);
  window.addEventListener('message',async event=>{
    if(event.source!==$('workspace').contentWindow||!key||!catalog)return;const data=event.data||{},capturedEpoch=epoch;
    try{
      if(data.type==='energize-route'){await show(data.route);return}
      if(data.type==='energize-download'){await download(data.id);return}
      if(data.type==='energize-notice'){notice(String(data.message||''));return}
      if(data.type!=='energize-request'||typeof data.requestId!=='string')return;
      const id=resolvePath(data.path);if(!id)throw Error('This file is not included in the hosted portal; check the source inventory.');const entry=findEntry(id);
      if(data.operation==='read'){const value=await payload(entry),bytes=bytesOf(value);if(capturedEpoch!==epoch||!key)return;event.source.postMessage({type:'energize-response',requestId:data.requestId,bytes:bytes.buffer,mime:entry.mime},'*',[bytes.buffer]);return}
      if(data.operation==='download')await download(id);else if(data.operation==='open')await show(id,data.path);else throw Error('Unsupported request.');
      if(capturedEpoch===epoch&&key)event.source.postMessage({type:'energize-response',requestId:data.requestId},'*');
    }catch(error){if(capturedEpoch===epoch&&key){notice(error.message);if(data.type==='energize-request')event.source.postMessage({type:'energize-response',requestId:data.requestId,error:error.message},'*')}}
  });
  $('unlock-form').addEventListener('submit',async event=>{
    event.preventDefault();if(pending)return;pending=true;const capturedEpoch=epoch;let password=$('password').value,secretBytes=null,material=null,derived=null,plain=null;
    $('password').value='';$('unlock').disabled=true;$('status').textContent='Unlocking…';
    try{
      if(!crypto?.subtle||typeof DecompressionStream==='undefined')throw Error('Use a current browser over HTTPS.');
      if(envelope.version!==1||envelope.algorithm!=='AES-256-GCM'||envelope.kdf!=='PBKDF2-SHA256'||envelope.iterations!==600000||envelope.compression!=='gzip')throw Error('Invalid catalog.');
      const salt=from64(envelope.salt),iv=from64(envelope.iv);if(salt.length!==32||iv.length!==12)throw Error('Invalid catalog.');
      secretBytes=encode.encode(password);password=null;material=await crypto.subtle.importKey('raw',secretBytes,'PBKDF2',false,['deriveKey']);secretBytes.fill(0);secretBytes=null;
      derived=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);material=null;
      plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:encode.encode('energize-private-portal:1:catalog'),tagLength:128},derived,from64(envelope.ciphertext));
      const unpacked=await unzip(plain);new Uint8Array(plain).fill(0);plain=null;const nextCatalog=JSON.parse(decode.decode(unpacked));unpacked.fill(0);
      if(capturedEpoch!==epoch||document.hidden){derived=null;return}if(!validCatalog(nextCatalog))throw Error('Invalid catalog.');
      key=derived;derived=null;catalog=nextCatalog;aborter=new AbortController();fillRoutes();await show('main');if(capturedEpoch!==epoch||!key)return;
      $('workspace').hidden=false;$('lock-bar').hidden=false;$('unlock-card').hidden=true;document.body.classList.add('open');$('status').textContent='';
    }catch{key=null;catalog=null;packetCache.clear();documentCache.clear();aborter?.abort();aborter=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;if(capturedEpoch===epoch&&!document.hidden){$('status').textContent='Unable to unlock. Check the password or retry the link.';$('password').focus()}}
    finally{password=null;material=null;derived=null;if(secretBytes)secretBytes.fill(0);if(plain)new Uint8Array(plain).fill(0);pending=false;$('unlock').disabled=false}
  });
})();
