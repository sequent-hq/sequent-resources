    if(capturedEpoch!==epoch||ticket!==routeEpoch||!key)return;currentId=id;let shown=id==='main'&&wasCached?html.replace('<html','<html data-energize-boot-seen="true"'):html;const sourcePath=requestPath||entry.relative_path||'';if(sourcePath)shown=shown.replace('<html','<html data-energize-request-path="'+esc(sourcePath.slice(0,8192))+'"');$('workspace').srcdoc=shown;$('route').value=id;notice('');

  function fillRoutes(){const select=$('route');select.replaceChildren();for(const entry of catalog.entries.filter(item=>item.id==='main'||item.id==='register'||item.pinned)){const option=document.createElement('option');option.value=entry.id;option.textContent=entry.title;select.append(option)}}
  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>show($('route').value).catch(error=>notice(error.message)));window.addEventListener('pagehide',lock);

  });
  $('unlock-form').addEventListener('submit',async event=>{
    event.preventDefault();if(pending)return;pending=true;const capturedEpoch=epoch;let password=$('password').value,secretBytes=null,material=null,derived=null,plain=null;

      key=derived;derived=null;catalog=nextCatalog;aborter=new AbortController();fillRoutes();await show('main');if(capturedEpoch!==epoch||!key)return;
      $('workspace').hidden=false;$('lock-bar').hidden=false;$('unlock-card').hidden=true;document.body.classList.add('open');$('status').textContent='';
    }catch{key=null;catalog=null;packetCache.clear();documentCache.clear();aborter?.abort();aborter=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;if(capturedEpoch===epoch&&!document.hidden){$('status').textContent='Unable to unlock. Check the password or retry the link.';$('password').focus()}}
    finally{password=null;material=null;derived=null;if(secretBytes)secretBytes.fill(0);if(plain)new Uint8Array(plain).fill(0);pending=false;$('unlock').disabled=false}
  });
})();
