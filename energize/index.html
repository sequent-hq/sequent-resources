  function lock(){lockEpoch++;documents=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;$('lock-bar').hidden=true;$('unlock-card').hidden=false;document.body.classList.remove('open');$('password').value='';$('status').textContent='';if(!document.hidden)$('password').focus()}
  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>showRoute($('route').value));window.addEventListener('pagehide',lock);
  window.addEventListener('message',event=>{if(event.source!==$('workspace').contentWindow||!documents||event.data?.type!=='energize-route')return;showRoute(event.data.route)});
  $('unlock-form').addEventListener('submit',async event=>{
    event.preventDefault();if(pending)return;pending=true;const epoch=lockEpoch;
    let password=$('password').value,bytes=null,material=null,key=null,plain=null;
    $('password').value='';$('unlock').disabled=true;$('status').textContent='Unlocking…';
    try{
      if(!globalThis.crypto?.subtle||typeof DecompressionStream==='undefined')throw Error('Unavailable');
      if(payload.version!==1||payload.algorithm!=='AES-256-GCM'||payload.kdf!=='PBKDF2-SHA256'||payload.iterations!==600000||payload.compression!=='gzip')throw Error('Invalid payload');
      const salt=decode(payload.salt),iv=decode(payload.iv);if(salt.length!==32||iv.length!==12)throw Error('Invalid payload');
      bytes=new TextEncoder().encode(password);password=null;
      material=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveKey']);bytes.fill(0);bytes=null;
      key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);material=null;
      plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('energize-private-platform:1:gzip-bundle'),tagLength:128},key,decode(payload.ciphertext));key=null;
      const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));new Uint8Array(plain).fill(0);plain=null;
      let bundle=JSON.parse(await new Response(stream).text());
      if(epoch!==lockEpoch||document.hidden){bundle=null;return}
      if(bundle.version!==1||bundle.default_route!=='main'||!bundle.documents||Object.keys(bundle.documents).sort().join(',')!=='main,register'||Object.values(bundle.documents).some(html=>typeof html!=='string'||!html.startsWith('<!doctype html>')))throw Error('Invalid document bundle');
      documents=bundle.documents;bundle=null;showRoute('main');$('workspace').hidden=false;$('lock-bar').hidden=false;$('unlock-card').hidden=true;document.body.classList.add('open');$('status').textContent='';
    }catch{
      documents=null;$('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;
      if(epoch===lockEpoch&&!document.hidden){$('status').textContent=globalThis.crypto?.subtle&&typeof DecompressionStream!=='undefined'?'Unable to unlock. Check the password and try again.':'Open this link in a current browser using HTTPS.';$('password').focus()}
    }finally{password=null;material=null;key=null;if(bytes)bytes.fill(0);if(plain)new Uint8Array(plain).fill(0);bytes=null;plain=null;pending=false;$('unlock').disabled=false}
  });
})();
