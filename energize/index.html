    }catch{
      $('workspace').removeAttribute('srcdoc');$('workspace').hidden=true;
      if(epoch===lockEpoch&&!document.hidden){$('status').textContent=globalThis.crypto?.subtle?'Unable to unlock. Check the password and try again.':'Open this link in a current browser using HTTPS.';$('password').focus()}
