  function preview(entry,value){const text=value.encoding==='base64'?'This native file is available as an encrypted download.':value.content;const partial=text.length>1200000;const body=partial?text.slice(0,1200000):text;return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(entry.title)+'</title><style>body{background:#11170f;color:#e5ecdc;font:14px/1.6 system-ui;margin:0}main{padding:30px;max-width:1200px;margin:auto}h1{font-size:28px}p{color:#b9c6a9}a{color:#e2ba60}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;border:1px solid #4b593f;background:#1b2517;padding:18px;border-radius:10px}</style></head><body><main><p>Energize · '+esc(entry.group)+'</p><h1>'+esc(entry.title)+'</h1><p>'+esc(entry.status||'Captured source; source-specific coverage limits apply.')+'</p><p><a href="#download" data-energize-download="'+esc(entry.id)+'">Download complete file ↓</a></p>'+(partial?'<p>Preview shows the first 1.2 million characters. The download contains the complete sanitized file.</p>':'')+'<pre>'+esc(body)+'</pre></main><script>'+"\n'use strict';\n(() => {\n  const pending=new Map();let sequence=0;\n  if(document.documentElement.dataset.portalKind==='hash-document')globalThis.energizeViewHash='';\n  const request=(operation,path,signal)=>new Promise((resolve,reject)=>{\n    if(signal?.aborted){reject(new DOMException('The request was cancelled.','AbortError'));return}\n    const requestId=Date.now().toString(36)+'-'+(++sequence)+'-'+Math.random().toString(36).slice(2);\n    const cleanup=()=>signal?.removeEventListener('abort',abort);\n    const timer=setTimeout(()=>{pending.delete(requestId);cleanup();reject(Error('The file is not available in this shared portal.'))},120000);\n    const abort=()=>{clearTimeout(timer);pending.delete(requestId);cleanup();reject(new DOMException('The request was cancelled.','AbortError'))};\n    signal?.addEventL   async function show(id,requestPath=''){

  }

  $('lock').addEventListener('click',lock);$('route').addEventListener('change',()=>show($('route').value).catch(error=>notice(error.message)));window.addEventListener('pagehide',lock);

    if(event.source!==$('workspace').contentWindow||!key||!catalog)return;const data=event.data||{},capturedEpoch=epoch;

  });
  $('unlock-form').addEventListener('submit',async event=>{
